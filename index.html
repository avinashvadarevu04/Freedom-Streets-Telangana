<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freedom Streets Telangana 2026 | Immersive Journey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- WebGL Canvas for 3D graphics -->
  <canvas id="webgl-canvas"></canvas>

  <!-- SVG Overlay for technical leader lines linking HTML cards to the 3D runner -->
  <svg id="leader-lines">
    <defs>
      <radialGradient id="dot-glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#a855f7" stop-opacity="1" />
        <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
      </radialGradient>
      <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
        <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
      </linearGradient>
    </defs>
  </svg>

  <!-- Telemetry HUD Dashboard Header -->
  <header class="hud-header">
    <div class="hud-brand">
      <img src="freedom_streets_logo.png" alt="Logo" class="hud-logo">
      <div class="hud-title-container">
        <span class="hud-tag">STATE CAMPAIGN 2026</span>
        <h1 class="hud-title">FREEDOM STREETS</h1>
      </div>
    </div>
    <div class="hud-nav-mode">
      <span class="hud-mode-active">CINEMATIC SCROLL EXPERIENCE</span>
      <a href="http://localhost:3000" class="hud-back-link">DASHBOARD MODE</a>
    </div>
  </header>

  <!-- Real-time Sports Telemetry sidebar -->
  <aside class="hud-telemetry">
    <div class="telemetry-block">
      <span class="telemetry-label">SPEED</span>
      <div class="telemetry-value-container">
        <span id="tel-speed" class="telemetry-value font-mono">0.0</span>
        <span class="telemetry-unit">KM/H</span>
      </div>
      <div class="telemetry-gauge">
        <div id="tel-speed-bar" class="gauge-fill"></div>
      </div>
    </div>

    <div class="telemetry-block">
      <span class="telemetry-label">CADENCE</span>
      <div class="telemetry-value-container">
        <span id="tel-cadence" class="telemetry-value font-mono">0</span>
        <span class="telemetry-unit">SPM</span>
      </div>
    </div>

    <div class="telemetry-block">
      <span class="telemetry-label">HEART RATE</span>
      <div class="telemetry-value-container">
        <span id="tel-hr" class="telemetry-value font-mono">72</span>
        <span class="telemetry-unit">BPM</span>
      </div>
    </div>

    <div class="telemetry-block">
      <span class="telemetry-label">Z-DEPTH</span>
      <div class="telemetry-value-container">
        <span id="tel-depth" class="telemetry-value font-mono">0</span>
        <span class="telemetry-unit">METERS</span>
      </div>
    </div>
  </aside>

  <!-- Floating Scroll Indicator Hint -->
  <div class="scroll-hint" id="scroll-hint">
    <span class="scroll-hint-text">SCROLL TO JOG</span>
    <div class="scroll-hint-wheel"></div>
  </div>

  <!-- Scrollable Wrapper for GSAP Timeline & Lenis Triggering -->
  <main class="scroll-wrapper">
    <!-- Tall container to configure scroll height (representing track distance) -->
    <div class="scroll-height-spacer"></div>
  </main>

  <!-- Load GSAP and ScrollTrigger via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  
  <script type="module" src="app.js"></script>
</body>
</html>
